# to source file be in a tmux env and enter 'tmux source ~/.tmux.conf'
# if added new plugins make sure to install them by `leader followed by shift+i`

# if there is a problem, check where you zsh is, by running `which zsh`
# then change the default-shell to the path of the zsh

# when sourcing this file, and using shift+r or shift+i to reload the config it might take a while so be patient

set-option -g default-shell /bin/zsh  # wihtin tmux, zsh is default


# When on, tmux uses the xterm extended key mode (CSI u protocol), which encodes the modifier information in the key sequence. This lets applications inside tmux correctly receive and differentiate modified key combinations like Ctrl+Enter, Shift+Enter, etc.
set -g extended-keys on
set -g extended-keys-format csi-u

# Remap prefix to Control + a
set -g prefix C-a
unbind C-b
bind C-a send-prefix

#status bar location
set-option -g status-position top

#Set plugin manager
# Set plugin manager and plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'omerxx/tmux-sessionx'

# Theme MUST load before continuum: the theme rewrites status-right, and continuum
# injects its periodic-save hook into status-right. Loading the theme afterwards
# silently disabled autosave (no saves landed between 2026-08-07 and 2026-09-05).
set -g @plugin 'idossha/tmux-nightfox'
set -g @tmux-nightfox 'carbonfox'

set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# Pane appearance (dim separators, uniform active outline, dimmed inactive panes).
# Must stay the LAST plugin: tpm runs plugins in order and the theme above would
# otherwise overwrite these options. Options: https://github.com/idossha/tmux-panestyle
set -g @plugin 'idossha/tmux-panestyle'

# Persistence: autosave every 15 minutes and restore the last save whenever the
# tmux server starts (first terminal after login/reboot). Ghostty is not one of
# continuum's supported @continuum-boot terminals, so the server is started by
# the `command` line in ghostty/.config/ghostty/config instead.
set -g @continuum-save-interval '15'
set -g @continuum-restore 'on'

# Manual save / restore: prefix + S / prefix + R
set -g @resurrect-save 'S'
set -g @resurrect-restore 'R'

# Restore pane scrollback and these processes (nvim reopens its session file).
set -g @resurrect-capture-pane-contents 'on'
set -g @resurrect-processes 'vim nvim top htop'
set -g @resurrect-strategy-nvim 'session'

# Navigate panes with Vim-like keys
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# The -r flag makes the binding repeatable—if you hold the key down after pressing your prefix it will continue resizing.
bind -r H resize-pane -L 5  # Resize pane 5 cells to the left
bind -r J resize-pane -D 5  # Resize pane 5 cells downward
bind -r K resize-pane -U 5  # Resize pane 5 cells upward
bind -r L resize-pane -R 5  # Resize pane 5 cells to the right

# Reload tmux config
bind r source-file ~/.tmux.conf

# open new pane with current path
bind '-' split-window -c "#{pane_current_path}"
bind | split-window -h -c "#{pane_current_path}"

# Enable mouse control
set -g mouse on

# Initialize tmux plugin manager (always keep this line at the bottom of this file.
run '~/.tmux/plugins/tpm/tpm'
