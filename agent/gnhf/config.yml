# Explicit execution modes prevent GNHF from injecting permission-bypass flags.
agent: codex
agentArgsOverride:
  codex:
    - --sandbox
    - workspace-write
    - -c
    - approval_policy="never"
  claude:
    - --permission-mode
    - default
commitMessage:
  preset: conventional
maxConsecutiveFailures: 2
preventSleep: true
