# Per-tool overrides on top of the generated server definitions below.
# approval_mode accepts auto | prompt | writes | approve; "approve" forces an
# explicit approval prompt for that one tool. These are the tools that spend a
# real budget (OpenAlex API calls that fan out) or execute arbitrary code in a
# browser, so they are worth a keystroke each. Declaring a sub-table before the
# parent [mcp_servers.<name>] table is legal TOML and keeps the generated block
# below untouched by hand-written settings.
[mcp_servers.openalex.tools.batch_resolve_references]
approval_mode = "approve"

[mcp_servers.openalex.tools.find_open_access_version]
approval_mode = "approve"

[mcp_servers.openalex.tools.get_work]
approval_mode = "approve"

[mcp_servers.openalex.tools.search_works]
approval_mode = "approve"

[mcp_servers.playwright.tools.browser_navigate]
approval_mode = "approve"

[mcp_servers.playwright.tools.browser_run_code_unsafe]
approval_mode = "approve"

# Everything between the two markers below is generated by
# agent/scripts/sync-agent-config.sh from agent/mcps/mcp-servers.json: the script
# deletes the old block and re-appends a fresh one at the end of the file. Edit
# the JSON, never this block, and keep both marker lines intact.
#
# `herdr integration install codex` appends a [hooks] table to this file through
# the symlink. It lands after the block; a later sync moves the block below it,
# which is still valid TOML and leaves the hooks alone.

# BEGIN DOTFILES AGENT MCP
# Generated by agent/scripts/sync-agent-config.sh from agent/mcps/mcp-servers.json — edit the JSON.
[mcp_servers.context7]
command = "npx"
args = ["-y", "@upstash/context7-mcp@latest"]

[mcp_servers.openalex]
command = "npx"
args = ["-y", "openalex-research-mcp"]

[mcp_servers.playwright]
command = "npx"
args = ["-y", "@playwright/mcp"]

# END DOTFILES AGENT MCP
