# Codex policy; sync renders a real ~/.codex/config.toml and preserves local state.
# Recheck provider flags with `codex features list` after upgrading the harness.
#
# Top-level bare keys must stay above the first table header, or TOML folds them
# into that table.

# User-selected sandbox defaults (§3.7): avoid permission interruptions in new sessions.
approval_policy = "never"
sandbox_mode = "workspace-write"

# AGENTS.md discovery walks every directory from the git project root down to cwd
# and loads at most one file per directory, in the order
# AGENTS.override.md > AGENTS.md > project_doc_fallback_filenames (this list),
# up to project_doc_max_bytes (default 32 KiB). Naming CLAUDE.md here means a repo
# whose only agent file is CLAUDE.md is still read by Codex, with no per-repo shim.
project_doc_fallback_filenames = ["CLAUDE.md"]

[tui]
# Modal editing in the composer, matching the maintainer's vim keymaps elsewhere.
vim_mode_default = true
# Segments rendered in the TUI status line, in order.
status_line = ["model-with-reasoning", "current-dir", "model", "project-name", "git-branch", "context-used"]

[features]
hooks = true
# Only flags that `codex features list` reports as stable or experimental belong
# here; a flag it reports as `removed` is ignored by the harness and is dead weight.
# Both below are reported `experimental`.
# Keeps the machine awake for the length of a long unattended turn.
prevent_idle_sleep = true
# Reflows scrollback when the surrounding pane is resized — this matters because
# Codex runs inside Herdr panes that get split and resized mid-session.
terminal_resize_reflow = true

# Clear earlier forced prompts so tools follow the user's automatic permission policy.
[apps._default]
default_tools_approval_mode = "auto"

[mcp_servers.openalex.tools.batch_resolve_references]
approval_mode = "auto"

[mcp_servers.openalex.tools.find_open_access_version]
approval_mode = "auto"

[mcp_servers.openalex.tools.get_work]
approval_mode = "auto"

[mcp_servers.openalex.tools.search_works]
approval_mode = "auto"

[mcp_servers.playwright.tools.browser_navigate]
approval_mode = "auto"

[mcp_servers.playwright.tools.browser_run_code_unsafe]
approval_mode = "auto"
